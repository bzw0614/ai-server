<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>电力业务专家 · AI 助手</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310a37f'/%3E%3Cpath d='M17.5 5 9 18h5.5L14 27l9-13.5h-5.8z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <!-- 左侧会话列表，交互参考 ChatGPT：新建会话 / 切换 / 删除 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-logo">⚡</span>
          <div class="brand-text">
            <strong>电力业务专家</strong>
            <span>ai-server</span>
          </div>
        </div>
        <button class="icon-btn" id="closeSidebarBtn" title="收起侧边栏" aria-label="收起侧边栏">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>新建对话</span>
      </button>

      <div class="sidebar-search">
        <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" placeholder="搜索历史对话" autocomplete="off" />
      </div>

      <nav class="chat-list" id="chatList"></nav>

      <div class="sidebar-foot">
        <div class="setting-row">
          <label for="temperature">随机性 temperature</label>
          <span class="setting-value" id="temperatureValue">0.7</span>
        </div>
        <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7" />
        <p class="setting-tip">值越大回答越发散，越小越稳定（对应后端 <code>temperature</code> 字段）。</p>

        <label class="switch-row">
          <span>流式输出</span>
          <input type="checkbox" id="streamToggle" checked />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <p class="setting-tip">开启后调用 <code>/api/chat/stream</code>，逐字返回；关闭则调用 <code>/api/chat</code>。</p>

        <button class="ghost-btn" id="clearAllBtn">清空全部对话</button>
      </div>
    </aside>
    <div class="sidebar-mask" id="sidebarMask" hidden></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="openSidebarBtn" title="展开侧边栏" aria-label="展开侧边栏">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="topbar-title">
          <h1 id="chatTitle">新的对话</h1>
          <span class="status-dot" id="statusDot"></span>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色">
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a7 7 0 0 0 9.5 9.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <div class="chat-scroll" id="chatScroll">
        <div class="chat-inner" id="messages"></div>
      </div>

      <div class="composer-wrap">
        <button class="scroll-bottom" id="scrollBottomBtn" hidden title="回到最新消息">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 10l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="给 AI 助手发送消息（电力计量、计费业务相关问题）" autocomplete="off"></textarea>
          <button type="submit" class="send-btn" id="sendBtn" title="发送" aria-label="发送">
            <svg class="icon-send" viewBox="0 0 24 24" width="18" height="18"><path d="M4 12l16-8-8 16-2.5-5.5z" fill="currentColor"/></svg>
            <svg class="icon-stop" viewBox="0 0 24 24" width="16" height="16"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
          </button>
        </form>
        <p class="composer-hint">Enter 发送 · Shift + Enter 换行 · 回答由大模型生成，请自行核对关键业务数据</p>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>

  <template id="emptyTemplate">
    <div class="empty">
      <div class="empty-logo">⚡</div>
      <h2>今天想了解哪方面的电力业务？</h2>
      <p class="empty-sub">AI 助手已接入电力行业知识，专注计量与计费相关业务。</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="介绍一下电力计量中的三相四线接线方式，以及常见的接线错误会带来什么影响？">
          <strong>计量原理</strong><span>三相四线接线方式与常见接线错误</span>
        </button>
        <button class="suggestion" data-prompt="两部制电价的基本原理是什么？基本电费按容量和按需量两种方式分别怎么计算？">
          <strong>计费规则</strong><span>两部制电价与基本电费计算方式</span>
        </button>
        <button class="suggestion" data-prompt="帮我设计一张电量电费明细表，需要包含哪些字段？并给出建表思路。">
          <strong>表结构设计</strong><span>电量电费明细表字段设计</span>
        </button>
        <button class="suggestion" data-prompt="在 Java 后端里做电量结算，如何用策略模式实现不同的计费规则？请给出示例代码。">
          <strong>开发实现</strong><span>策略模式实现多种计费规则</span>
        </button>
      </div>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
